        <script>
            var EosSdk = window.EosSdk || {};
    // @@@ EOS - GL extra function to get formContext from Form
            EosSdk.setClientApiContext = function(xrm, formContext, entity) {
                // Optionally set Xrm and formContext as global variables on the page.
                if (document.eosInfo != null){
                    return;
                    //delete document.eosInfo;
                }
                document.eosInfo = new Object();
                document.eosInfo.Xrm = xrm;
                document.eosInfo._formContext = formContext;
                document.eosInfo._entity = entity;
                document._entity = entity;
    
                document.eosInfo.srcCPQ = formContext.getControl("WebResource_CPQ").getSrc();
    
                if (entity == "opportunity" || entity == "quote") {
                    document.eosInfo.accountField = "customerid";
                    document.eosInfo.obkFileField = "mas_obkfile";
                    document.eosInfo.remarks = new Object();
                }
                else {
                    document.eosInfo.accountField = "accountid";
                    document.eosInfo.obkFileField = "mas_obkfile";
                }
                if (entity == "opportunity") {
                    document.eosInfo.entitySetname = "opportunities";
                }
                else if (entity == "quote") {
                    document.eosInfo.entitySetname = "quotes";
                }
                document.eosInfo.recordId = formContext.data.entity.getId();
    
                // Add script logic here that uses xrm or the formContext.
                //eg.: formContext.getAttribute("name").setValue("Pippo");
                document.eosInfo._pcon_basket_url = "https://integration.basket.pcon-solutions.com/v2.13/?mode=integration";
                document.eosInfo._pcon_overdue_days = "30";
                x = EosSdk.getCeParam(xrm, "PCON_BASKET_URL", document.eosInfo._pcon_basket_url);
                y = EosSdk.getCeParam(xrm, "PCON_OVERDUE_DAYS", document.eosInfo._pcon_overdue_days);
    
                document.eosInfo.oData = new Object();
                if (entity == "opportunity")
                {
                    EosSdk.getCeOppData(xrm, formContext.data.entity.getId(), document.eosInfo.oData);
                }
                else if (entity == "quote")
                {
                    EosSdk.getCeQuoData(xrm, formContext.data.entity.getId(), document.eosInfo.oData);
                }
                setTimeout(function() { startBasket(); }, 100);
            }
    
            EosSdk.getCeParam = function(xrm, paramName, eosObj) {
                    var result = xrm.WebApi.retrieveMultipleRecords("eos_parameter", "?$select=eos_name,eos_stringparam,eos_intparam&$top=1&$filter=eos_name eq '" + paramName + "'").then(
                    function success(result) {
                        for (var i = 0; i < result.entities.length; i++) {
                            try {
                                eosObj = result.entities[i]["eos_stringparam"];
                                console.log(paramName + ": " + eosObj);
                            } catch (error) {
                                console.log("Err. EosSdk.getCeParam*[" + paramName + "]: " + error.message);
                            }
                        }
                        // perform additional operations on retrieved records
                        return eosObj;
                    },
                    function (error) {
                        debugger;
                        eosObj = "";
                        console.log("Err. EosSdk.getCeParam[" + paramName + "]: " + error.message);
                        return eosObj;
                        // handle error conditions
                    }
                );        
            }

                                eosObj.a_street = "";
                                eosObj.a_city = "";

                            else {

                                eosObj.a_cusnumber = result["customerid_account"]["eoslib_customernumber"];

                                eosObj.a_city = result["customerid_account"]["address1_city"];
                                eosObj.a_zip = result["customerid_account"]["address1_postalcode"];
                                eosObj.a_country = result["customerid_account"]["eos_countryid"] == null ? "" : result["customerid_account"]["eos_countryid"]["eos_code"];
                                eosObj.a_lang = result["customerid_account"]["eos_languageid"] == null ? "" : result["customerid_account"]["eos_languageid"]["eos_code"];
                            }
    
                            if (result["mas_contactid"] == null) {
                                eosObj.c_name = "";
                                eosObj.c_firstname = "";
                                eosObj.c_lastname = "";
                                eosObj.c_street = "";
                                eosObj.c_city = "";
                                eosObj.c_zip = "";
                                eosObj.c_email = "";
                                eosObj.c_phone = "";
                                eosObj.c_country = "";
                            }
                            else {
                                //debugger;
                                eosObj.c_name = result["mas_contactid"]["fullname"];
                                eosObj.c_firstname = result["mas_contactid"]["firstname"];
                                eosObj.c_lastname = result["mas_contactid"]["lastname"];
                                eosObj.c_street = result["mas_contactid"]["address1_line1"];
                                eosObj.c_city = result["mas_contactid"]["address1_city"];
                                eosObj.c_zip = result["mas_contactid"]["address1_postalcode"];
                                eosObj.c_email = result["mas_contactid"]["emailaddress1"];
                                eosObj.c_phone = result["mas_contactid"]["telephone1"];
                                eosObj.c_country = result["mas_contactid"]["eos_countryid"] == null ? "" : result["mas_contactid"]["eos_countryid"]["eos_code"];

                            eosObj.customerNo =  result["eoslib_customernumber"];
                            eosObj.legalEntity =  result[""];
                            eosObj.priceList =  result["name"];
                            eosObj.salesperson =  result["name"];
                            // ma_ = prefix for mainAddress
                            eosObj.ma_street =  result["name"]; 
                            eosObj.ma_city =  result["name"];
                            eosObj.ma_postalcode =  result["name"];
                            eosObj.ma_country =  result["name"];
                            // ca_ = prefix for customerAddress
                            eosObj.ca_street =  result["name"]; 
                            eosObj.ca_city =  result["name"];
                            eosObj.ca_postalcode =  result["name"];
                            eosObj.ca_country =  result["name"];
    */

                        console.log("Err EosSdk.getCeOppData: " + error.message);
                        // handle error conditions
                    }
                );
            }

        <div id="intro" class="contentWrapper">

                <h2>pCon.basket integration</h2>
                <!--
                This example demonstrates how to embedd pCon.basket as an iframe and shows how to communicate with the basket.
                If you want to load an already existing article list you can select an OBK or OBX file before starting the basket.
                Otherwise the basket will be started with a new/empty article list.
                -->

                    <label for="fileInput" style="display:none;">OBK/OBX file: </label>
